<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-title" content="Планёрка">

<title>Планёрка</title>
<style>
[hidden]{display:none!important}
:root{--bg:#f3f1ec;--card:#fff;--ink:#1d2328;--mute:#6b7378;--line:#e2ded6;--acc:#c4572e;--acc2:#1f6f5c;--bad:#b42318;--soft:#f8efe9;--soft2:#e8f3ef;--head:#1f2a33;--inp:#fbfaf7}
@media (prefers-color-scheme:dark){:root{--bg:#14181b;--card:#1d2328;--ink:#eef0f1;--mute:#9aa3a8;--line:#2e363c;--acc:#e0784f;--acc2:#4fbf9f;--bad:#f07167;--soft:#2a211d;--soft2:#17302a;--head:#0f1316;--inp:#252c32}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--inp);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
header{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:calc(11px + env(safe-area-inset-top)) 14px 11px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:none;border:0;color:#fff;font-size:22px;padding:0 6px}
main{padding:12px 12px 30px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label.f{display:block;font-size:12px;color:var(--mute)}label.f input{margin-top:3px}
.mute{color:var(--mute)}.small{font-size:12.5px}
.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--acc);color:#fff;font-weight:600}
.btn.sec{background:var(--soft);color:var(--acc)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn.wide{width:100%}.btn.sm{padding:7px 11px;font-size:13.5px}
.x{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 8px;flex:none}
h2{font-size:16px;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:baseline}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1;background:none;border:0;padding:9px 0 8px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bot button b{font-size:19px;font-weight:400;line-height:1}
nav.bot button.on{color:var(--acc)}
.plan{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px;margin-bottom:10px}
.plan .t{font-weight:700;font-size:16px}
.prog{height:7px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--acc2);transition:width .2s}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 4px 5px 12px;font-size:14px}
.chip .x{font-size:15px;padding:2px 6px}
.pick{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:14px}
.pick.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tool{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.tool:last-child{border-bottom:0}
.tool .bx{width:26px;height:26px;border:2px solid var(--line);border-radius:7px;flex:none;display:grid;place-items:center;font-size:17px;color:#fff}
.tool.on .bx{background:var(--acc2);border-color:var(--acc2)}
.tool.on .nm{text-decoration:line-through;color:var(--mute)}
.tool .nm{font-size:15.5px}
#cres .tool.on .nm{text-decoration:none;color:var(--ink);font-weight:600}
#cres .tool.on{background:var(--soft2)}
.tool .for{font-size:12px;color:var(--mute);margin-top:1px}
.big{font-size:24px;font-weight:800}
.ok{color:var(--acc2)}
.li{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
details.w{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
details.w>summary{list-style:none;padding:13px 12px;display:flex;justify-content:space-between;gap:8px;font-weight:600;cursor:pointer}
details.w>summary::-webkit-details-marker{display:none}
details.w[open]>summary{border-bottom:1px solid var(--line)}
details.sub{border-top:1px solid var(--line)}
details.sub>summary{list-style:none;padding:12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;font-weight:600;font-size:14.5px;background:var(--bg)}
details.sub>summary::-webkit-details-marker{display:none}
details.sub>summary span:first-child::before{content:'▸ ';color:var(--acc)}
details.sub[open]>summary span:first-child::before{content:'▾ '}
.empty{text-align:center;color:var(--mute);padding:26px 10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;z-index:99;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.sep{height:1px;background:var(--line);margin:10px 0}
/*THEME-START — современный стиль «Мастер плитки»*/
:root{--bg:#f2f3f5;--card:#fff;--ink:#14181c;--mute:#69727a;--line:#e5e7ea;--line2:rgba(16,24,40,.07);
  --acc:#d0592f;--acc2:#0f7a63;--bad:#c42b1c;--warn:#b7791f;--soft:#fcefe9;--soft2:#e5f4ee;--inp:#f6f7f8;
  --head:rgba(242,243,245,.86);--headink:#14181c;--sh:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.06);--ring:rgba(208,89,47,.2)}
@media (prefers-color-scheme:dark){:root{--bg:#0d1012;--card:#171b1f;--ink:#eef1f3;--mute:#98a1a8;--line:#262c31;--line2:#22282d;
  --acc:#f07a4d;--acc2:#44c29b;--bad:#ff7a6e;--warn:#e8ae55;--soft:#2c1d16;--soft2:#11291f;--inp:#1e2328;
  --head:rgba(13,16,18,.86);--headink:#eef1f3;--sh:0 1px 2px rgba(0,0,0,.3);--ring:rgba(240,122,77,.25)}}
html,body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
input,select,textarea{font-size:16px!important;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inp);min-height:46px;transition:border-color .15s,box-shadow .15s}
input[type=checkbox]{min-height:0;accent-color:var(--acc)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--ring);background:var(--card)}
input::placeholder{color:#a3aab0}
label.f{font-size:13px;font-weight:500;color:var(--mute)}
label.f input,label.f select{margin-top:5px}
header{background:var(--head)!important;color:var(--headink)!important;-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px!important;min-height:calc(58px + env(safe-area-inset-top));border-bottom:1px solid var(--line2)}
header h1{font-size:21px!important;font-weight:750;letter-spacing:-.02em}
header button,header .back{color:var(--ink)!important;background:var(--card)!important;border:1px solid var(--line2)!important;border-radius:12px!important;min-width:38px;height:38px;padding:0 8px!important;font-size:18px!important;display:inline-grid;place-items:center;box-shadow:var(--sh)}
.tabs{background:var(--head)!important;-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);top:calc(58px + env(safe-area-inset-top))!important;padding:8px 12px 10px!important;gap:6px!important;border-bottom:1px solid var(--line2)}
.tabs button{background:var(--card)!important;color:var(--mute)!important;font-weight:600;font-size:14.5px!important;padding:8px 15px!important;border:1px solid var(--line2)!important;box-shadow:var(--sh)}
.tabs button.on{background:var(--ink)!important;color:var(--bg)!important;border-color:var(--ink)!important}
main{padding:14px 14px 100px}
.card,.job,.plan,.item,details.cat,details.w,.kpi div,#stage{border:1px solid var(--line2)!important;box-shadow:var(--sh);border-radius:18px!important}
.card{padding:16px}
.job,.plan,.item{padding:16px;transition:transform .1s}
.job:active,.plan:active,.item:active{transform:scale(.99)}
.job .t,.plan .t,.item .t{font-size:17px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:750;letter-spacing:-.02em;margin:24px 4px 10px}
h3{font-size:16px;font-weight:700}
.small{font-size:13.5px}
.btn{border-radius:14px;padding:13px 16px;font-weight:650;letter-spacing:-.005em;transition:transform .08s,filter .15s}
.btn:not(.sec):not(.ghost){background:var(--acc);box-shadow:0 6px 16px -6px rgba(208,89,47,.55)}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--soft);color:var(--acc)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.sm{padding:9px 13px;font-size:14px;border-radius:12px}
.x{border-radius:10px}
.chips{gap:8px}
.chips button,.pick,.tools button{border:1px solid var(--line)!important;background:var(--card);border-radius:999px;padding:8px 14px;font-size:14.5px;font-weight:500;box-shadow:var(--sh)}
.tools button{border-radius:12px}
.chips button.on,.pick.on,.tools button.on{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff}
.chip{border-color:var(--line2)!important;box-shadow:var(--sh);font-weight:500;padding:6px 4px 6px 13px}
details.cat>summary,details.w>summary{padding:15px 16px;font-size:16px}
details.sub>summary{padding:13px 16px}
.it{padding:13px 16px}
.it .nm{font-size:15.5px;font-weight:500}
.it .meta{font-size:13px}
.tool{padding:14px 16px}
.tool .bx{border-radius:8px}
.kpi div{padding:12px}
.kpi b{font-size:20px;letter-spacing:-.02em}
nav.bot{background:var(--head)!important;-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);border-top:1px solid var(--line2)!important}
nav.bot button{font-size:11.5px;font-weight:600;padding:8px 0 7px}
nav.bot button b{font-size:20px;width:46px;height:28px;display:grid;place-items:center;border-radius:999px;transition:background .15s}
nav.bot button.on b{background:var(--soft)}
.bar{left:10px!important;right:10px!important;bottom:calc(66px + env(safe-area-inset-bottom))!important;border-radius:16px;background:#14181c!important;color:#fff;padding:10px 16px!important;box-shadow:0 10px 30px -8px rgba(0,0,0,.45)}
@media (prefers-color-scheme:dark){.bar{background:#262c31!important}}
.toast{border-radius:999px!important;padding:11px 18px!important;font-weight:500;box-shadow:0 10px 30px -8px rgba(0,0,0,.4)}
.sep{background:var(--line2)}
.var,.pat button{border-radius:14px}
table.doc{font-size:14px}
.empty{padding:40px 16px}
/*THEME-END*/
</style>
</head>

let S;
function load(){
  try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
  if(!S)S={works:[],plans:[],view:'plans',cur:null};
  S.works=S.works||[];S.plans=S.plans||[];
}
let st;function save(){clearTimeout(st);st=setTimeout(saveNow,200)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Не удалось сохранить')}}
window.addEventListener('pagehide',saveNow);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveNow()});

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const norm=s=>String(s||'').trim().toLowerCase().replace(/ё/g,'е').replace(/\s+/g,' ');
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const tomorrow=()=>{const d=new Date();d.setDate(d.getDate()+1);return iso(d)};
const WD=['вс','пн','вт','ср','чт','пт','сб'];
function fdate(s){if(!s)return'';const [y,m,d]=s.split('-');const dt=new Date(+y,+m-1,+d);const t=iso(new Date()),tm=tomorrow();
  const base=`${d}.${m} (${WD[dt.getDay()]})`;return s===t?'Сегодня, '+base:s===tm?'Завтра, '+base:base}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),1700)}
const work=id=>S.works.find(w=>w.id===id);
const plan=()=>S.plans.find(p=>p.id===S.cur);
function splitTools(txt){return String(txt).split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean)}

// Сборка общего списка: инструмент без повторов + для каких работ
function toolList(P){
  const map=new Map();
  for(const wid of P.works){const w=work(wid);if(!w)continue;
    for(const t of w.tools){const k=norm(t);if(!k)continue;if(!map.has(k))map.set(k,{key:k,name:t,for:[]});map.get(k).for.push(w.name)}}
  for(const t of P.extra){const k=norm(t);if(!k)continue;if(!map.has(k))map.set(k,{key:k,name:t,for:[]});map.get(k).extra=true}
  return[...map.values()];
}
function progress(P){const L=toolList(P);const got=L.filter(t=>P.got[t.key]).length;return{L,got,all:L.length}}

// ---------- рендер ----------
function hdr(t,back,extra=''){$('#hdr').innerHTML=(back?`<button data-act="back">‹</button>`:'')+`<h1>${esc(t)}</h1>`+extra}
function render(){
  document.querySelectorAll('nav.bot button').forEach(b=>b.classList.toggle('on',b.dataset.go===S.view||(S.view==='plan'&&b.dataset.go==='plans')));
  if(S.view==='plan'&&!plan())S.view='plans';
  ({plans:renderPlans,plan:renderPlan,works:renderWorks,cat:renderCat,more:renderMore})[S.view]();
}
function go(v){S.view=v;save();render();scrollTo(0,0)}

function renderPlans(){
  hdr('Планёрка');
  const ps=S.plans.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let h=`<button class="btn wide" data-act="newplan">+ План на завтра</button><div style="height:12px"></div>`;
  if(!S.works.length)h+=`<div class="card small">Сначала зайдите в «Мои работы» (или в «Справочник») и заведите виды работ со своим инструментом. Потом в плане на день просто выбираете работы — список инструмента соберётся сам.</div>`;
  if(!ps.length)h+=`<div class="empty">Планов пока нет</div>`;
  for(const P of ps){const pr=progress(P);const pc=pr.all?pr.got/pr.all*100:0;
    h+=`<button class="plan" data-act="open" data-id="${P.id}"><div class="row" style="justify-content:space-between"><span class="t">${esc(fdate(P.date))}</span><span class="small ${pr.all&&pr.got===pr.all?'ok':'mute'}">${pr.all?(pr.got===pr.all?'✓ всё взял':`взял ${pr.got} из ${pr.all}`):''}</span></div>
    ${P.place?`<div class="small">${esc(P.place)}</div>`:''}
    <div class="small mute" style="margin-top:3px">${P.works.map(id=>esc(work(id)?.name||'')).filter(Boolean).join(' · ')||'работы не выбраны'}</div>
    ${pr.all?`<div class="prog"><i style="width:${pc}%"></i></div>`:''}</button>`}
  $('#main').innerHTML=h;
}

function renderPlan(){
  const P=plan();
  hdr(fdate(P.date)||'План',true,`<button data-act="dupplan" title="Повторить" style="font-size:15px">⧉</button><button data-act="delplan" title="Удалить" style="font-size:17px">🗑</button>`);
  const free=S.works.filter(w=>!P.works.includes(w.id));
  let h=`<div class="card"><div class="grid2"><label class="f">Дата<input type="date" data-pf="date" value="${esc(P.date)}"></label><label class="f">Объект / адрес<input data-pf="place" value="${esc(P.place)}" placeholder="где работаем"></label></div></div>
  <h2>Что делаем</h2><div class="card">
  <div class="chips">${P.works.map(id=>{const w=work(id);return w?`<span class="chip">${esc(w.name)}<button class="x" data-act="rmwork" data-id="${id}">✕</button></span>`:''}).join('')||'<span class="small mute">Выберите работы ниже</span>'}</div>
  ${free.length?`<div class="sep"></div><div class="small mute" style="margin-bottom:6px">Добавить из своих работ:</div><div class="chips">${free.map(w=>`<button class="pick" data-act="addwork" data-id="${w.id}">+ ${esc(w.name)}</button>`).join('')}</div>`:''}
  <div class="sep"></div>
  <div class="row"><input id="nw" placeholder="Новый вид работы"><button class="btn" data-act="newwork">+</button></div>
  <label class="f" style="margin-top:8px">Заметка на день<textarea data-pf="note" rows="2" placeholder="что не забыть, кому позвонить…">${esc(P.note||'')}</textarea></label></div>
  <div id="tl">${toolsBlock(P)}</div>`;
  $('#main').innerHTML=h;
}
function toolsBlock(P){
  const pr=progress(P);
  let h=`<h2><span>Инструмент — собрать</span><span class="small ${pr.all&&pr.got===pr.all?'ok':'mute'}">${pr.all?`${pr.got} из ${pr.all}`:''}</span></h2>`;
  if(pr.all){h+=`<div class="prog" style="margin:0 4px 10px"><i style="width:${pr.got/pr.all*100}%"></i></div>`;
    if(pr.got===pr.all)h+=`<div class="card ok" style="text-align:center;font-weight:700">✓ Всё собрано, можно ехать</div>`}
  const empties=P.works.map(work).filter(w=>w&&!w.tools.length);
  if(empties.length)h+=`<div class="card small">У работ ${empties.map(w=>'«'+esc(w.name)+'»').join(', ')} ещё нет инструмента. Впишите его ниже или в «Мои работы».</div>`;
  const L=pr.L;
  const sorted=[...L.filter(t=>!P.got[t.key]),...L.filter(t=>P.got[t.key])];
  if(L.length)h+=`<div class="card" style="padding:0;overflow:hidden">${sorted.map(t=>`<div class="tool ${P.got[t.key]?'on':''}" data-tool="${esc(t.key)}"><span class="bx">${P.got[t.key]?'✓':''}</span><div><div class="nm">${esc(t.name)}</div><div class="for">${t.for.length?esc(t.for.join(', ')):'дополнительно'}</div></div></div>`).join('')}</div>`;
  h+=`<div class="card"><div class="small mute" style="margin-bottom:6px">Добавить инструмент</div>
  ${P.works.length?`<select id="tw" style="margin-bottom:8px"><option value="">только на этот день</option>${P.works.map(id=>work(id)).filter(Boolean).map(w=>`<option value="${w.id}">к «${esc(w.name)}»</option>`).join('')}</select>`:''}<div class="row"><input id="tn" placeholder="Что взять"><button class="btn" data-act="addtool">+</button></div>
  <div class="small mute" style="margin-top:6px">Если выбрать работу — инструмент запомнится для неё навсегда.</div>
  ${P.extra.length?`<div class="sep"></div>${P.extra.map((t,i)=>`<div class="li"><span class="grow">${esc(t)} <span class="small mute">— только на этот день</span></span><button class="x" data-act="rmextra" data-i="${i}">✕</button></div>`).join('')}`:''}</div>
  ${L.length?`<div class="row" style="gap:8px"><button class="btn sec" style="flex:1" data-act="share">Отправить список</button><button class="btn ghost" style="flex:1" data-act="untick">Снять галочки</button></div>`:''}`;
  return h;
}

function renderWorks(){
  hdr('Мои работы и инструмент');
  let h=`<div class="card"><div class="row"><input id="nw2" placeholder="Вид работы, напр. «Укладка плитки на стены»"><button class="btn" data-act="newwork2">+</button></div></div>`;
  if(!S.works.length)h+=`<div class="empty">Заведите виды работ, которые делаете, и к каждой — весь инструмент. Это делается один раз.</div>`;
  S.works.forEach((w,i)=>{
    h+=`<details class="w" data-wid="${w.id}" ${openW.has(w.id)?'open':''}><summary><span>${esc(w.name)}</span><span class="small mute">${w.tools.length} шт.</span></summary><div style="padding:12px">
    <label class="f">Название<input data-wn="${w.id}" value="${esc(w.name)}"></label><div style="height:10px"></div>
    ${w.tools.map((t,k)=>`<div class="li"><span class="grow">${esc(t)}</span><button class="x" data-act="up" data-w="${w.id}" data-k="${k}" ${k?'':'disabled style="opacity:.2"'}>↑</button><button class="x" data-act="rmtool" data-w="${w.id}" data-k="${k}">✕</button></div>`).join('')||'<div class="small mute">Инструмента пока нет</div>'}
    <div class="row" style="margin-top:10px"><input data-ti="${w.id}" placeholder="Инструмент (можно сразу несколько через запятую)"><button class="btn" data-act="addtoolw" data-w="${w.id}">+</button></div>
    <button class="btn sec sm" style="margin-top:10px" data-act="fromcat" data-w="${w.id}">☰ Выбрать из справочника</button>
    ${toolSuggest(w)}
    <div class="row" style="margin-top:12px;gap:8px"><button class="btn ghost sm" data-act="copywork" data-w="${w.id}">Копия работы</button><button class="btn ghost sm" style="color:var(--bad)" data-act="delwork" data-w="${w.id}">Удалить работу</button></div>
    </div></details>`});
  $('#main').innerHTML=h;
}
const openW=new Set();
// подсказки: инструмент из других работ, которого нет в этой
function toolSuggest(w){
  const have=new Set(w.tools.map(norm));const seen=new Set();const out=[];
  for(const o of S.works)for(const t of o.tools){const k=norm(t);if(!have.has(k)&&!seen.has(k)){seen.add(k);out.push(t)}}
  if(!out.length)return'';
  return`<div class="small mute" style="margin:10px 0 6px">Из других работ — нажмите, чтобы добавить:</div><div class="chips">${out.map(t=>`<button class="pick" data-act="sugg" data-w="${w.id}" data-t="${esc(t)}">+ ${esc(t)}</button>`).join('')}</div>`;
}

// ---------- справочник ----------
let catQ='';
// поиск по словам, без окончаний: «сверло» найдёт «свёрла», «диск 125» — «диск … 125 мм»
const LAT={a:'а',b:'в',c:'с',e:'е',h:'н',k:'к',m:'м',o:'о',p:'р',t:'т',x:'х',y:'у'};const l2c=w=>w.replace(/[abcehkmoptxy]/g,ch=>LAT[ch]);
function qwords(q){return norm(q).split(' ').filter(Boolean).map(w=>l2c(w.length>4?w.replace(/[аеиоуыяюйь]+$/,''):w))}
function match(text,ws){const toks=norm(text).split(/[^a-zа-я0-9]+/).map(l2c);return ws.every(w=>toks.some(t=>t.startsWith(w)))}const secQ={};const openSec=new Set();
function target(){let w=work(S.catTarget);if(!w&&S.works.length){w=S.works[0];S.catTarget=w.id}return w}
function ciRow(name,w){const on=w&&w.tools.some(t=>norm(t)===norm(name));return`<div class="tool ${on?'on':''}" data-ci="${esc(name)}"><span class="bx">${on?'✓':''}</span><div class="nm">${esc(name)}</div></div>`}
function secBody(si,w){
  const [,,groups]=CATALOG[si];const q=qwords(secQ[si]||'');let h='',n=0;
  for(const [g,items] of groups){const its=items.filter(t=>!q.length||match(t,q));if(!its.length)continue;n+=its.length;
    if(g)h+=`<div class="small mute" style="padding:10px 12px 4px;font-weight:600">${esc(g)}</div>`;h+=its.map(t=>ciRow(t,w)).join('')}
  return n?h:`<div class="small mute" style="padding:12px">Ничего не найдено</div>`;
}
function globalRes(w){
  const q=qwords(catQ);let h='',n=0;
  CATALOG.forEach(([title,,groups])=>{const its=[];for(const [,items] of groups)for(const t of items)if(match(title+' '+t,q))its.push(t);
    if(its.length){n+=its.length;h+=`<h2>${esc(title)}</h2><div class="card" style="padding:0;overflow:hidden">${its.map(t=>ciRow(t,w)).join('')}</div>`}});
  const ph=profGlobal(w);
  if(ph)h=`<h2>По профессиям</h2>`+ph+(h?h:'');
  return(n||ph)?h:`<div class="empty">Ничего не найдено. Можно вписать свой инструмент в «Мои работы».</div>`;
}
function secList(w){
  let h='';
  for(const kind of ['w','c']){
    h+=`<h2>${kind==='w'?'По видам работ':'Расходники и оснастка'}</h2>`;
    CATALOG.forEach(([title,k,groups],si)=>{if(k!==kind)return;const total=groups.reduce((a,g)=>a+g[1].length,0);
      const have=w?groups.reduce((a,g)=>a+g[1].filter(t=>w.tools.some(x=>norm(x)===norm(t))).length,0):0;
      h+=`<details class="w" data-sec="${si}" ${openSec.has(si)?'open':''}><summary><span>${esc(title)}</span><span class="small ${have?'ok':'mute'}">${have?have+' из '+total:total}</span></summary>
      <div style="padding:10px 12px 0"><input data-sq="${si}" placeholder="Поиск в разделе «${esc(title)}»" value="${esc(secQ[si]||'')}"></div>
      <div id="sb-${si}">${secBody(si,w)}</div>
      ${w?`<div style="padding:10px 12px 12px"><button class="btn ghost sm" data-act="addsec" data-si="${si}">Добавить весь раздел в «${esc(w.name)}»</button></div>`:''}</details>`});
  }
  return h;
}
function renderCat(){
  hdr('Справочник инструмента');const w=target();
  let h=`<div class="card">${S.works.length?`<label class="f">Нажатие на инструмент добавляет его в работу:<select id="ct" style="margin-top:4px">${S.works.map(x=>`<option value="${x.id}" ${w&&x.id===w.id?'selected':''}>${esc(x.name)} (${x.tools.length})</option>`).join('')}</select></label><div style="height:8px"></div>`:'<div class="small" style="margin-bottom:8px">Сначала создайте свою работу — в неё будет добавляться инструмент:</div>'}
  <div class="row"><input id="cnw" placeholder="Новая работа, напр. «Плитка в санузле»"><button class="btn" data-act="catnew">+</button></div></div>
  <div class="search" style="margin-bottom:6px"><input id="cq" placeholder="🔍 Поиск по всему справочнику: диск, сверло, гребёнка…" value="${esc(catQ)}"></div>
  <div id="cres">${catQ.trim()?globalRes(w):profList(w)+secList(w)}</div>`;
  $('#main').innerHTML=h;
}
function refreshCat(){const w=target();$('#cres').innerHTML=catQ.trim()?globalRes(w):profList(w)+secList(w)}

// ---------- по профессиям ----------
const pQ={};const openProf=new Set();const openPW=new Set();
function pwBlock(pi,wi,tools,w,open){
  const [wname]=PROFS[pi][1][wi];const key=pi+'-'+wi;
  return`<details class="sub" data-pw="${key}" ${open?'open data-auto="1"':openPW.has(key)?'open':''}><summary><span>${esc(wname)}</span><span class="small mute">${tools.length}</span></summary>
  <div style="padding:8px 12px"><button class="btn sm" data-act="mkwork" data-pi="${pi}" data-wi="${wi}">+ В мои работы со всем инструментом</button></div>
  ${tools.map(t=>ciRow(t,w)).join('')}</details>`;
}
function profBody(pi,w){
  const q=qwords(pQ[pi]||'');let h='';
  PROFS[pi][1].forEach(([wname,tools],wi)=>{
    if(!q.length){h+=pwBlock(pi,wi,tools,w,false);return}
    const ts=match(wname,q)?tools:tools.filter(t=>match(t,q));
    if(ts.length)h+=pwBlock(pi,wi,ts,w,true)});
  return h||`<div class="small mute" style="padding:12px">Ничего не найдено</div>`;
}
function profList(w){
  let h=`<h2>По профессиям <span class="small mute">виды работ и инструмент</span></h2>`;
  PROFS.forEach(([pname,works],pi)=>{
    h+=`<details class="w" data-prof="${pi}" ${openProf.has(pi)?'open':''}><summary><span>${esc(pname)}</span><span class="small mute">${works.length} работ</span></summary>
    <div style="padding:10px 12px 4px"><input data-pq="${pi}" placeholder="Поиск: работа или инструмент" value="${esc(pQ[pi]||'')}"></div>
    <div id="pb-${pi}">${profBody(pi,w)}</div></details>`});
  return h;
}
function profGlobal(w){
  const q=qwords(catQ);let h='';
  PROFS.forEach(([pname,works],pi)=>works.forEach(([wname,tools],wi)=>{
    const ts=match(pname+' '+wname,q)?tools:tools.filter(t=>match(pname+' '+wname+' '+t,q));
    if(ts.length)h+=`<div class="small mute" style="margin:10px 4px 4px">${esc(pname)}</div><div class="card" style="padding:0;overflow:hidden">${pwBlock(pi,wi,ts,w,match(pname+' '+wname,q)?false:true)}</div>`}));
  return h;
}

function renderMore(){
  hdr('Ещё');
  $('#main').innerHTML=`<div class="card"><b>Резервная копия</b><p class="small mute">Всё хранится только в этом телефоне. Время от времени сохраняйте копию.</p>
  <div class="row" style="gap:8px"><button class="btn" style="flex:1" data-act="export">Сохранить копию</button><button class="btn sec" style="flex:1" data-act="import">Загрузить копию</button></div><input type="file" id="impf" accept=".json,application/json" hidden></div>
  <div class="card"><button class="btn ghost wide" data-act="clearold">Удалить планы старше 30 дней</button></div>
  <p class="small mute" style="margin:4px">Работ: ${S.works.length}, планов: ${S.plans.length}. Работает без интернета.</p>`;
}

// ---------- действия ----------
function addToolsTo(w,txt){let n=0;const have=new Set(w.tools.map(norm));for(const t of splitTools(txt)){if(!have.has(norm(t))){w.tools.push(t);have.add(norm(t));n++}}return n}
function newWork(name){name=String(name||'').trim();if(!name)return null;let w=S.works.find(x=>norm(x.name)===norm(name));if(!w){w={id:uid(),name,tools:[]};S.works.push(w)}return w}
async function share(text){
  try{if(navigator.share){await navigator.share({title:'Инструмент',text});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text);toast('Скопировано')}catch(e){prompt('Скопируйте:',text)}
}
document.addEventListener('click',e=>{
  const tl=e.target.closest('[data-tool]');
  if(tl){const P=plan();const k=tl.dataset.tool;P.got[k]=!P.got[k];if(!P.got[k])delete P.got[k];save();$('#tl').innerHTML=toolsBlock(P);if(navigator.vibrate)navigator.vibrate(12);return}
  const ci=e.target.closest('[data-ci]');
  if(ci){const w=target();if(!w){toast('Сначала создайте работу вверху');$('#cnw')?.focus();return}const name=ci.dataset.ci;const i=w.tools.findIndex(t=>norm(t)===norm(name));
    if(i>=0){w.tools.splice(i,1);ci.classList.remove('on');ci.querySelector('.bx').textContent='';toast('Убрано из «'+w.name+'»')}else{w.tools.push(name);ci.classList.add('on');ci.querySelector('.bx').textContent='✓';toast('Добавлено в «'+w.name+'»')}
    save();const o=$('#ct')?.selectedOptions[0];if(o)o.textContent=`${w.name} (${w.tools.length})`;if(navigator.vibrate)navigator.vibrate(10);return}
  const b=e.target.closest('[data-act],[data-go]');if(!b)return;
  if(b.dataset.go){go(b.dataset.go);return}
  const a=b.dataset.act,P=plan();
  switch(a){
    case'back':go('plans');break;
    case'newplan':{const p={id:uid(),date:tomorrow(),place:'',note:'',works:[],extra:[],got:{}};S.plans.push(p);S.cur=p.id;go('plan');break}
    case'open':S.cur=b.dataset.id;go('plan');break;
    case'dupplan':{const p=JSON.parse(JSON.stringify(P));p.id=uid();p.date=tomorrow();p.got={};S.plans.push(p);S.cur=p.id;save();render();toast('План повторён на завтра');break}
    case'delplan':if(confirm('Удалить этот план?')){S.plans=S.plans.filter(p=>p.id!==S.cur);go('plans')}break;
    case'addwork':if(!P.works.includes(b.dataset.id))P.works.push(b.dataset.id);save();renderPlan();break;
    case'rmwork':P.works=P.works.filter(x=>x!==b.dataset.id);save();renderPlan();break;
    case'newwork':{const w=newWork($('#nw').value);if(!w){toast('Впишите название');break}if(!P.works.includes(w.id))P.works.push(w.id);save();renderPlan();break}
    case'addtool':{const v=$('#tn').value;if(!v.trim()){toast('Впишите, что взять');break}const wid=$('#tw')?.value;
      if(wid){const n=addToolsTo(work(wid),v);toast(n?'Добавлено к работе':'Уже есть')}else{for(const t of splitTools(v))if(!P.extra.some(x=>norm(x)===norm(t)))P.extra.push(t)}
      save();$('#tl').innerHTML=toolsBlock(P);if(wid)$('#tw').value=wid;$('#tn').focus();break}
    case'rmextra':P.extra.splice(+b.dataset.i,1);save();$('#tl').innerHTML=toolsBlock(P);break;
    case'untick':P.got={};save();$('#tl').innerHTML=toolsBlock(P);break;
    case'share':{const pr=progress(P);let t=`Инструмент — ${fdate(P.date)}${P.place?' · '+P.place:''}\n`;if(P.works.length)t+=`Работы: ${P.works.map(id=>work(id)?.name).filter(Boolean).join(', ')}\n`;t+='\n'+pr.L.map(x=>(P.got[x.key]?'✅ ':'⬜ ')+x.name).join('\n');share(t);break}
    case'newwork2':{const w=newWork($('#nw2').value);if(!w){toast('Впишите название');break}openW.add(w.id);save();renderWorks();const i=document.querySelector(`[data-ti="${w.id}"]`);if(i)i.focus();break}
    case'addtoolw':{const w=work(b.dataset.w);const inp=document.querySelector(`[data-ti="${w.id}"]`);if(!inp.value.trim())break;addToolsTo(w,inp.value);save();openW.add(w.id);renderWorks();const i=document.querySelector(`[data-ti="${w.id}"]`);if(i)i.focus();break}
    case'sugg':{const w=work(b.dataset.w);addToolsTo(w,b.dataset.t);save();openW.add(w.id);renderWorks();break}
    case'rmtool':{const w=work(b.dataset.w);w.tools.splice(+b.dataset.k,1);save();openW.add(w.id);renderWorks();break}
    case'up':{const w=work(b.dataset.w),k=+b.dataset.k;if(k>0){[w.tools[k-1],w.tools[k]]=[w.tools[k],w.tools[k-1]]}save();openW.add(w.id);renderWorks();break}
    case'copywork':{const w=work(b.dataset.w);const c={id:uid(),name:w.name+' (копия)',tools:[...w.tools]};S.works.push(c);openW.add(c.id);save();renderWorks();break}
    case'delwork':if(confirm('Удалить вид работы со всем инструментом?')){const id=b.dataset.w;S.works=S.works.filter(w=>w.id!==id);for(const p of S.plans)p.works=p.works.filter(x=>x!==id);save();renderWorks()}break;
    case'fromcat':S.catTarget=b.dataset.w;go('cat');break;
    case'catnew':{const w=newWork($('#cnw').value);if(!w){toast('Впишите название работы');break}S.catTarget=w.id;save();renderCat();toast('Работа создана — выбирайте инструмент');break}
    case'mkwork':{const [wname,tools]=PROFS[+b.dataset.pi][1][+b.dataset.wi];const w=newWork(wname);const n=addToolsTo(w,tools.join('\n'));S.catTarget=w.id;save();
      const sy=scrollY;renderCat();scrollTo(0,sy);toast(n?`«${wname}» — добавлено ${n} поз. в Мои работы`:'Всё уже есть в «'+wname+'»');break}
    case'addsec':{const w=target();const n=addToolsTo(w,CATALOG[+b.dataset.si][2].flatMap(g=>g[1]).join('\n'));save();refreshCat();toast(n?`Добавлено: ${n}`:'Всё уже есть');break}
    case'export':{saveNow();const blob=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});const f=new File([blob],`planerka-kopiya-${iso(new Date())}.json`,{type:'application/json'});
      if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Копия планёрки'}).catch(()=>{});
      else{const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download=f.name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}break}
    case'import':$('#impf').click();break;
    case'clearold':{const d=new Date();d.setDate(d.getDate()-30);const lim=iso(d);const n=S.plans.length;S.plans=S.plans.filter(p=>(p.date||'')>=lim);save();toast('Удалено планов: '+(n-S.plans.length));renderMore();break}
  }
});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.target.tagName==='TEXTAREA')return;const id=e.target.id;
  const map={nw:'newwork',nw2:'newwork2',tn:'addtool',cnw:'catnew'};
  if(id==='cq'||e.target.dataset.sq!==undefined||e.target.dataset.pq!==undefined){e.preventDefault();e.target.blur();return}
  if(map[id]){e.preventDefault();document.querySelector(`[data-act="${map[id]}"]`)?.click()}
  else if(e.target.dataset.ti){e.preventDefault();document.querySelector(`[data-act="addtoolw"][data-w="${e.target.dataset.ti}"]`)?.click()}});
document.addEventListener('input',e=>{const el=e.target,d=el.dataset;
  if(el.id==='cq'){catQ=el.value;clearTimeout(el._t);el._t=setTimeout(refreshCat,150);return}
  if(d.pq!==undefined){pQ[d.pq]=el.value;clearTimeout(el._t);el._t=setTimeout(()=>{const b=document.getElementById('pb-'+d.pq);if(b)b.innerHTML=profBody(+d.pq,target())},120);return}
  if(d.sq!==undefined){secQ[d.sq]=el.value;clearTimeout(el._t);el._t=setTimeout(()=>{const b=document.getElementById('sb-'+d.sq);if(b)b.innerHTML=secBody(+d.sq,target())},120);return}
  if(d.pf){const P=plan();P[d.pf]=el.value;if(d.pf==='date')$('#hdr h1').textContent=fdate(el.value);save();return}
  if(d.wn){const w=work(d.wn);w.name=el.value;const s=el.closest('details').querySelector('summary span');if(s)s.textContent=el.value;save();return}});
document.addEventListener('toggle',e=>{const el=e.target;if(el.dataset&&el.dataset.prof!==undefined){el.open?openProf.add(+el.dataset.prof):openProf.delete(+el.dataset.prof)}if(el.dataset&&el.dataset.pw){if(el.dataset.auto){delete el.dataset.auto}else{el.open?openPW.add(el.dataset.pw):openPW.delete(el.dataset.pw)}}if(el.dataset&&el.dataset.sec!==undefined){el.open?openSec.add(+el.dataset.sec):openSec.delete(+el.dataset.sec)}if(el.dataset&&el.dataset.wid){el.open?openW.add(el.dataset.wid):openW.delete(el.dataset.wid)}},true);
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='ct'){S.catTarget=el.value;save();refreshCat();return}if(el.id==='impf'&&el.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o||!Array.isArray(o.works))throw 0;if(confirm('Заменить текущие данные копией?')){S=o;load2();saveNow();toast('Копия загружена');go('plans')}}catch(_){toast('Это не файл копии планёрки')}};fr.readAsText(el.files[0])}});
function load2(){S.works=S.works||[];S.plans=S.plans||[];for(const p of S.plans){p.works=p.works||[];p.extra=p.extra||[];p.got=p.got||{}}}
load();load2();render();
</script>
</body>
